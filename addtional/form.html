<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="laptop.css">
    <!-- icons link  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <!-- login form container  -->
        <div class="form-container">
            <!-- company information -->
            <div class="company-info">
                <h1>Come Join Us!</h1>
                <p>we are so excited to have you here. if you haven't already, create account to get access to exclusive offers, reward and discounts.</p>
                <form action="#" class="already-btn-form">
                    <button type="button" class="already-account-btn">Already have an account? Signin</button>
                </form>
            </div>
            <!-- login info content  -->
            <div class="login-info-container">
                <form action="#" class="info-form">
                    <div class="form-heading">
                        <h1>SingUp</h1>
                    </div>
                    <div class="form-info">
                        <div>
                            <label for="user-name">User Name</label>
                            <input type="text" required placeholder="enter your name">
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="email" required placeholder="enter your email">
                        </div>
                        <div>
                            <label for="password">Password</label>
                            <input type="password" required placeholder="password">
                        </div>
                        <div>
                            <label for="password">confirm Password</label>
                            <input type="password" required placeholder="confirm password">
                        </div>
                        <button type="submit" class="form-submit-button">Signup</button>
                    </div>
                    <div class="another-login">
                        <span><a href="#">or signup with</a></span>
                        <div class="loging-links">
                            <a href="#">
                                <i class="ri-facebook-circle-fill"></i>
                            </a>
                            <a href="#"><i class="ri-google-fill"></i></a>
                            <a href="#"><i class="ri-linkedin-fill"></i></a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
